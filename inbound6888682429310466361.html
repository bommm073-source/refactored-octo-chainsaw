<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เที่ยวระยอง – ทะเล เกาะ ธรรมชาติ และของอร่อย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4fbfb;--card:#fff;--tx:#12333a;--mut:#5b7a80;--pri:#0a8f9c;--pri2:#e8f6f7;--bd:#d5e8ea;--hero:linear-gradient(135deg,#4fd1d9,#8fe3c8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt','Noto Sans Thai',Tahoma,sans-serif;line-height:1.55}
.hero{background:var(--hero);color:#06424a;padding:44px 20px 70px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}
.hero p{margin:0 auto;max-width:560px;opacity:.95}
.wrap{max-width:1000px;margin:-40px auto 40px;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
#q{width:100%;padding:12px 16px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
#q:focus{outline:2px solid var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--pri2);color:var(--tx);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.count{margin:16px 4px 8px;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ic{height:90px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--pri2)}
.ic.big{height:170px}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:12px;color:var(--pri);background:var(--pri2);padding:2px 10px;border-radius:999px}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--mut);font-size:14px;flex:1}
.btns{display:flex;gap:8px;margin-top:8px}
.btns a{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none}
.nav{background:var(--pri);color:#fff}
.map{background:var(--pri2);color:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header class="hero">
  <h1>🏝️ เที่ยวระยอง</h1>
  <p>ทะเลสวย เกาะใสน้ำคริสตัล ธรรมชาติ วัด และอาหารทะเลสด ค้นหาแล้วกดนำทางไป Google Maps ได้ทันที</p>
</header>
<main class="wrap">
  <div class="panel">
    <input id="q" type="search" placeholder="🔍 ค้นหาสถานที่ เช่น เสม็ด, น้ำตก, วัด">
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>ข้อมูลเพื่อการวางแผนเที่ยวเบื้องต้น ควรตรวจสอบเวลาเปิด–ปิดและค่าเข้าชมก่อนเดินทาง</footer>

var cats=["ทั้งหมด"].concat(P.map(function(p){return p[1]}).filter(function(c,i,a){return a.indexOf(c)===i}));
var cur="ทั้งหมด",q=document.getElementById("q"),grid=document.getElementById("grid"),chips=document.getElementById("chips"),count=document.getElementById("count");
function enc(s){return encodeURIComponent(s)}
function render(){
  var t=q.value.trim().toLowerCase();
  var list=P.filter(function(p){return (cur==="ทั้งหมด"||p[1]===cur)&&(!t||(p[0]+p[1]+p[3]).toLowerCase().indexOf(t)>-1)});
  count.textContent="พบ "+list.length+" สถานที่";
  if(!list.length){grid.innerHTML='<div class="empty">ไม่พบสถานที่ที่ค้นหา ลองคำอื่นดูนะ</div>';return}
  grid.innerHTML=list.map(function(p){
    var n=enc(p[0]);
    return '<article class="card">'+(IMG[p[0]]?'<div class="ic big"><img loading="lazy" alt="'+p[0]+'" src="'+IMG[p[0]]+'"></div>':'<div class="ic">'+p[2]+'</div>')+'<div class="bd"><span class="tag">'+p[1]+'</span><h3>'+p[0].replace(" ระยอง","")+'</h3><p>'+p[3]+'</p><div class="btns"><a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+n+'">🧭 นำทาง</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+n+'">📍 ดูแผนที่</a></div></div></article>';
  }).join("");
}
function drawChips(){
  chips.innerHTML=cats.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join("");
}
chips.addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cur=c;drawChips();render()}});
q.addEventListener("input",render);
drawChips();render();
</script>
